[project]
name = "veeduria-ec"
version = "0.1.0"
description = "Veeduría ciudadana automatizada de GADs del Ecuador con datos abiertos (SERCOP y LOTAIP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
veeduria = "veeduria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veeduria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
